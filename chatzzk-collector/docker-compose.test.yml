services:
  test-db:  # 테스트용 데이터베이스 - production에서는 클라우드 사용
    image: postgres
    container_name: chatzzk-test-db
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pw
      - POSTGRES_DB=test_db
    ports:
      - "5432:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-adminer:  # 테스트용 데이터베이스 관리 UI - 클라우드에서 제공됨
    image: adminer
    ports:
      - 8080:8080

  asr-inference-server:  # 실제 파이프라인에서 필요 -> k8s
    image: chatzzk-asr-inference-server
    ports:
      - 8000:8000
    volumes:
      - test-models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  llm-proxy-server:  # 실제 파이프라인에서 필요 -> k8s
    image: llm-proxy-server
    ports:
      - "4000:4000"
    env_file:  # .env를 사용할 것
      - app/servers/llm_proxy_server/.env

volumes:
  test-db-data:
  test-minio-data:
  test-models:
