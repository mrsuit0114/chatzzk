[project]
name = "chatzzk-collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatzzk-clients[no-asr-inference]",
    "chatzzk-collector[db-migration]",
    "chatzzk-data-access",
    "chatzzk-schemas",
    "chatzzk-constants",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "dependency-injector>=4.48.2",
]

[project.optional-dependencies]

db-migration = [
    "chatzzk-schemas[orm]",
    "alembic>=1.17.2",
    "alembic-postgresql-enum>=1.8.0",
    "psycopg2-binary>=2.9.11",
]

dev = [
    "pre-commit>=4.4.0",
    "ruff>=0.14.5",
]

[tool.uv.sources]
"chatzzk-schemas" = { workspace = true }
"chatzzk-constants" = { workspace = true }
"chatzzk-data-access" = { workspace = true }
"chatzzk-clients" = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
