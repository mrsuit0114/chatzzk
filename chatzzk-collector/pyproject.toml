[project]
name = "chatzzk-collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatzzk-core",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
pipeline = [
    "chatzzk-data-access",
    "chatzzk-clients[no-asr-inference]",
    "chatzzk-collector[db-migration]",
    "prefect>=3.6.6",
    "dependency-injector>=4.48.2",
]

db-migration = [
    "alembic>=1.17.2",
    "alembic-postgresql-enum>=1.8.0",
    "psycopg2-binary>=2.9.11",
]

dev = [
    "pre-commit>=4.4.0",
    "ruff>=0.14.5",
]

[tool.uv.sources]
"chatzzk-core" = { workspace = true }
"chatzzk-data-access" = { workspace = true }
"chatzzk-clients" = { workspace = true }
"asr-inference-server" = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
    "app/servers/asr_inference_server",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["chatzzk_core", "chatzzk_data_access", "chatzzk_clients"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (potential bugs)
]

ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
]
