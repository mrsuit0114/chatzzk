[project]
name = "chatzzk-data-access"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "chatzzk_data_access[storage]",
    "chatzzk_data_access[repository]",
]

[project.optional-dependencies]
storage = [
    "aiofiles>=25.1.0",
    "orjson>=3.11.4",
]
repository = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatzzk_data_access"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
