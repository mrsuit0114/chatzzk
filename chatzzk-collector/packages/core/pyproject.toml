[project]
name = "chatzzk-core"
version = "0.1.0"
description = "Core shared logic, schemas (DTOs), and constants for Chatzzk services."
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatzzk_core"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
