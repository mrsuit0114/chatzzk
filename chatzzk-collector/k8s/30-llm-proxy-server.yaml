# 1. Deployment (서버 본체)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy-server
  namespace: chatzzk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-proxy-server
  template:
    metadata:
      labels:
        app: llm-proxy-server
    spec:
      containers:
      - name: llm-proxy
        image: chatzzk-llm-proxy-server:latest
        imagePullPolicy: Never  # 로컬 이미지 사용

        ports:
        - containerPort: 8000

        envFrom:
        - secretRef:
            name: chatzzk-secrets

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

        # 헬스 체크 (서버가 켜졌는지 확인)
        readinessProbe:
          httpGet:
            path: /health  # FastAPI에 health 체크 엔드포인트가 있다고 가정
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

---
# 2. Service (내부 통신용 문패)
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy-service
  namespace: chatzzk
spec:
  selector:
    app: llm-proxy-server
  ports:
    - protocol: TCP
      port: 80          # 클러스터 내부 접근 포트 (http://llm-proxy-service:80)
      targetPort: 8000  # 컨테이너 포트
  type: ClusterIP
