apiVersion: batch/v1
kind: Job
metadata:
  name: manual-trigger-test
spec:
  template:
    spec:
      containers:
      - name: trigger-runner
        image: chatzzk-collector-worker:latest
        imagePullPolicy: Never
        # discovery와 processing을 순차적으로 실행
        # command: ["/bin/sh", "-c", "python -c 'from chatzzk.services.collector.jobs.triggers import trigger_vod_discovery; trigger_vod_discovery()' && python -c 'from chatzzk.services.collector.jobs.triggers import trigger_vod_processing; trigger_vod_processing()'"]
        command: ["/bin/sh", "-c", "python -c 'from chatzzk.services.collector.jobs.triggers import trigger_vod_processing; trigger_vod_processing()'"]
        envFrom:
          - secretRef:
              name: all-in-one-secrets
      restartPolicy: Never
  backoffLimit: 0
