# 프로젝트 이름 (임의 지정)
name: chatzzk-collector
prefect-version: 3.0.0

# 1. 빌드 단계 (Minikube에서 수동 빌드하므로 여기선 생략하거나 참조용으로 둡니다)
build: null

# 2. 푸시 단계 (Minikube 로컬 이미지를 쓰므로 푸시하지 않음)
push: null

# 3. 풀 단계 (이미지 내부에 코드가 있다고 가정)
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

# 4. 배포 정의 (핵심 ⭐)
deployments:
  # ---------------------------------------------------
  # [1] Discovery Flow: 수집 대상 탐색 (가볍게 자주 실행)
  # ---------------------------------------------------
  - name: "discovery-flow-deployment"
    entrypoint: "app/pipeline/workflows/discovery_flow.py:discovery_flow"
    description: "새로운 채널 및 비디오 탐색"
    tags: ["crawler", "lightweight"]

    # [스케줄] 30분마다 실행
    schedule:
      cron: "*/30 * * * *"
      timezone: "Asia/Seoul"

    work_pool:
      name: "kubernetes-pool"
      job_variables:
        image: "chatzzk-collector:latest"
        image_pull_policy: "Never" # Minikube 필수

        # [K8s 설정 오버레이]
        customizations:
          # (1) 통합 Secret 주입 (DB 정보 등)
          - op: add
            path: /spec/template/spec/containers/0/envFrom
            value:
              - secretRef:
                  name: chatzzk-secrets

  # ---------------------------------------------------
  # [2] Processing Flow: 영상 다운로드 및 처리 (무겁게 가끔 실행)
  # ---------------------------------------------------
  - name: "processing-flow-deployment"
    entrypoint: "app/pipeline/workflows/processing_flow.py:processing_flow"
    description: "VOD 다운로드, ASR 변환 및 데이터 처리"
    tags: ["gpu", "heavy"]


    schedule:
      cron: "*/30 * * * *"
      timezone: "Asia/Seoul"

    work_pool:
      name: "kubernetes-pool"
      job_variables:
        image: "chatzzk-collector:latest"
        image_pull_policy: "Never"

        # [K8s 설정 오버레이]
        customizations:
          # (1) 통합 Secret 주입 (DB, API Key)
          - op: add
            path: /spec/template/spec/containers/0/envFrom
            value:
              - secretRef:
                  name: chatzzk-secrets

          # (2) PVC 마운트 (데이터 저장용) - Processing Flow에만 필요하다면 여기에만 작성
          - op: add
            path: /spec/template/spec/containers/0/volumeMounts
            value:
              - name: data-volume
                mountPath: /app/samples
                subPath: temp-samples
          - op: add
            path: /spec/template/spec/volumes
            value:
              - name: data-volume
                persistentVolumeClaim:
                  claimName: chatzzk-pvc
