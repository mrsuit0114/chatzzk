model_list:
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      temperature: 0.1
      top_p: 0.8

litellm_settings:
  success_callback: ["langfuse"]
  turn_off_message_logging: False  # False: log input output prompt, Ture: not log individual information


router_settings:
  model_group_alias: {"short_term_summary": "gemini"}
