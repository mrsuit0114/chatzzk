  asr_inference_server:
    build:
      context: .
      dockerfile: ./chatzzk/services/asr_inference_server/Dockerfile
    container_name: chatzzk_asr_inference_server
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  db-init:
    build:
      context: .
      dockerfile: ./scripts/Dockerfile
    container_name: chatzzk_db_init
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
