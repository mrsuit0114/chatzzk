  #   container_name: chatzzk_collector

  #   # .env 파일의 정확한 경로를 명시
  #   env_file:
  #     - ./chatzzk/services/collector/.env
  #   # volumes:
  #     - /var/tmp/chatzzk_processor:/var/tmp/chatzzk_processor

  asr_inference_server:
    build:
      context: .
      dockerfile: ./chatzzk/services/asr_inference_server/Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  db-init:
    build:
      context: .
      dockerfile: ./scripts/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres
    # restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - /var/tmp/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    # restart: always
    ports:
      - 8080:8080
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - /var/tmp/minio/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
