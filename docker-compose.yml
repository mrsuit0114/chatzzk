services:

  db:
    image: postgres
    # restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - "5432:5432"
    env_file:
      - docker.env
    volumes:
      - /var/tmp/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    # restart: always
    ports:
      - 8080:8080

  db-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - docker.env

  asr_inference_server:
    build:
      context: ./chatzzk
      dockerfile: services/asr_inference_server/Dockerfile
    env_file:
      - docker.env
    ports:
      - 8000:8000
    volumes:
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  redis:
    image: redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - /var/tmp/minio/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - docker.env

  collector_worker:
    build:
      context: ./chatzzk
      dockerfile: services/collector/Dockerfile
    ports:
      - "5678:5678" # 디버거가 연결할 포트
    command: >
      python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m celery -A chatzzk.services.collector.celery_app worker -l info -c 1 -P solo
    env_file:
      - docker.env

    depends_on:
      - asr_inference_server
      - redis
      - db
      - db-init
      - minio
      - adminer
