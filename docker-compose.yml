version: '3.8'

services:
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  watcher:
    build:
      context: ./BroadcasterStatusWatcher
    container_name: broadcaster_watcher
    env_file:
      - ./BroadcasterStatusWatcher/.env
    networks:
      - app-network
    depends_on:
      - redis

volumes:
  redis-data:


networks:
  app-network:
    driver: bridge
