services:
  test-db:
    image: postgres
    container_name: chatzzk-test-db
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pw
      - POSTGRES_DB=test_db
    ports:
      - "5432:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-adminer:
    image: adminer
    ports:
      - 8080:8080

  asr-inference-server:
    image: test-asr-server
    ports:
      - 8000:8000
    volumes:
      - test-models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  test-db-data:
  test-minio-data:
  test-models:
