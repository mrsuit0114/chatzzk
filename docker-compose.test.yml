services:
  test-db:
    image: postgres
    container_name: chatzzk-test-db
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=testdb
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U testuser -d testdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-minio:
    image: minio/minio
    container_name: chatzzk-test-minio
    environment:
      - MINIO_ROOT_USER=testadmin
      - MINIO_ROOT_PASSWORD=testsecret
    ports:
      - "9001:9000"
      - "9091:9090"
    command: server /data --console-address ":9090"
    volumes:
      - test-minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-adminer:
    image: adminer
    # restart: always
    ports:
      - 8081:8080
  test-redis:
    image: redis
    container_name: chatzzk-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  test-db-data:
  test-minio-data:
