# ====================== Poetry Project Definition ======================
# [project] 섹션이 [tool.poetry]로 대체/통합됩니다.
[tool.poetry]
name = "chatzzk"
version = "0.1.0"
description = "A service to analyze live streaming platform data."
authors = ["Your Name <you@example.com>"] # 이 부분을 자신의 정보로 채워주세요.
readme = "README.md"
# 'where' 설정 대신, Poetry는 패키지 구조를 직접 명시합니다.
packages = [{include = "chatzzk", from = "."}]


# ====================== Poetry Dependencies ======================
[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
loguru = "^0.7.3"
orjson = "^3.11.2"
pathlib = "^1.0.1"
requests = "^2.32.5"
sqlalchemy = "^2.0.43"
psycopg2-binary = "^2.9.10"
numpy = "^2.3.2"
torch = "^2.8.0"
dependency-injector = "^4.48.1"
alembic = "^1.16.5"
aiolimiter = "^1.2.1"
asyncpg = "^0.30.0"
alembic-postgresql-enum = "^1.8.0"

[tool.poetry.group.collector.dependencies]
requests = "^2.32.5"
tenacity = "^9.1.2"
ffmpeg-python = "^0.2.0"
minio = "^7.2.16"
celery = "^5.5.3"
torchaudio = "^2.8.0"
silero-vad = "^6.0.0"
redis = "^6.4.0"
soundfile = "^0.13.1"
torchcodec = "^0.7.0"
onnxruntime = "^1.23.0"
aiofiles = "^25.1.0"
m3u8 = "^6.0.0"

[tool.poetry.group.scripts.dependencies]
python-dotenv = "^1.1.1"
alembic = "^1.16.5"



[tool.poetry.group.dev.dependencies]
ruff = "^0.12.10"
pre-commit = "^4.3.0"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
requests-mock = "^1.12.1"
pytest-env = "^1.1.5"
pytest-dotenv = "^0.5.2"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.2.0"
aioresponses = "^0.7.8"


[tool.poetry.group.asr_inference_server.dependencies]
whisperx = "^3.4.2"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
tenacity = "^9.1.2"
python-multipart = "^0.0.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
target-version = "py311"
line-length = 120

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "legacy",
    "vod_context",
    "monitor_worker",
    "analysis",
    "common",
]

[tool.ruff.lint]
select = [
    "C",   # McCabe complexity
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (potential bugs)
]
ignore = [
    "C901", # Function is too complex
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
# 'chatzzk'로 시작하는 모든 import를 first-party(내부) 모듈로 간주하도록 명시
known-first-party = ["chatzzk", "tests", "migrations"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
