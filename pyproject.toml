# ====================== Poetry Project Definition ======================
# [project] 섹션이 [tool.poetry]로 대체/통합됩니다.
[tool.poetry]
name = "chatzzk"
version = "0.1.0"
description = "A service to analyze live streaming platform data."
authors = ["Your Name <you@example.com>"] # 이 부분을 자신의 정보로 채워주세요.
readme = "README.md"
# 'where' 설정 대신, Poetry는 패키지 구조를 직접 명시합니다.
packages = [{include = "chatzzk", from = "."}]


# ====================== Poetry Dependencies ======================
[tool.poetry.dependencies]
python = ">=3.11,<4.0" # Python 버전 제약을 명시합니다.
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
loguru = "^0.7.3"
orjson = "^3.11.2"
pathlib = "^1.0.1"
requests = "^2.32.5"
sqlalchemy = "^2.0.43"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.collector.dependencies]
requests = "^2.32.5"
tenacity = "^9.1.2"
ffmpeg-python = "^0.2.0"

[tool.poetry.group.db_init.dependencies]
python-dotenv = "^1.1.1"



[tool.poetry.group.dev.dependencies]
ruff = "^0.12.10"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
# src 설정을 통해 Ruff가 'chatzzk'를 프로젝트의 소스 루트로 인식하게 함
src = ["chatzzk"]

target-version = "py311"
line-length = 120
exclude = ["legacy","vod_context","monitor_worker","llm_service", "common", "analysis"]

[tool.ruff.lint]
select = [
    "C",   # McCabe complexity
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (potential bugs)
]
ignore = [
    "C901", # Function is too complex
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
