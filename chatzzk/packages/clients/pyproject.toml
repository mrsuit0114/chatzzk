[project]
name = "chatzzk-clients"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "chatzzk-schemas",
    "chatzzk-constants",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
http-core = [
    "aiohttp>=3.13.2",
    "tenacity>=9.1.2",
]
numpy = [
    "numpy>=2.3.5",
]
silero-vad = [
    "silero-vad>=6.2.0",
]
ml-backend = [
    "torch>=2.9.1",
    "torchcodec>=0.8.1",
]
media-tools = [
    "aiofiles>=25.1.0",
    "ffmpeg-python>=0.2.0",
    "m3u8>=6.0.0",
]
whisperx = [
    "torch==2.8.0",
    "whisperx>=3.4.3",
]

dev = [
    "chatzzk_clients[http-core]",
    "chatzzk_clients[numpy]",
    "chatzzk_clients[silero-vad]",
    "chatzzk_clients[ml-backend]",
    "chatzzk_clients[media-tools]",
]

[tool.uv]
conflicts = [
    [
        { extra = "ml-backend" },
        { extra = "whisperx" },
        { extra = "dev" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatzzk_clients"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
