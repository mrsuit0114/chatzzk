apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  # StatefulSet의 각 Pod가 고유한 네트워크 주소를 가질 수 있도록 Headless Service를 지정합니다.
  # 아래 31-minio-service.yaml 파일의 ClusterIP를 None으로 설정하여 만듭니다.
  serviceName: "minio-headless-service"
  replicas: 1 # 초기에는 단일 인스턴스로 시작합니다.
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio
        # StatefulSet의 안정적인 Pod 이름(minio-0)을 활용하도록 command 수정 가능 (현재는 단일 인스턴스)
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        envFrom:
          - secretRef:
              name: all-in-one-secrets
        # volumeMounts는 Pod 내부의 마운트 경로를 지정합니다.
        volumeMounts:
        - name: minio-data # 아래 volumeClaimTemplates의 이름과 일치해야 합니다.
          mountPath: /data
        # Liveness/Readiness Probe 추가 (안정성 강화)
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3

  # PostgreSQL과 동일하게, Pod 생성 시 PVC를 자동으로 생성하는 템플릿입니다.
  volumeClaimTemplates:
  - metadata:
      name: minio-data # Pod가 이 이름으로 PVC를 참조합니다.
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi # MinIO 데이터를 위한 50GiB 공간 요청
