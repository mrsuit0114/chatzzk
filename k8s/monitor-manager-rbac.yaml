# monitor-manager-rbac.yaml (예시)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-manager-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-manager-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"] # 모니터링 Pod 상태 확인 등을 위해 필요할 수 있음
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-manager-rolebinding
subjects:
- kind: ServiceAccount
  name: monitor-manager-sa
  namespace: default
roleRef:
  kind: Role
  name: monitor-manager-role
  apiGroup: rbac.authorization.k8s.io
