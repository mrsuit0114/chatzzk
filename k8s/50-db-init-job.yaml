apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-create-tables # Job 이름 변경
spec:
  template:
    spec:
      containers:
      - name: db-initializer
        image: chatzzk-db-init:latest # 동일한 이미지 사용
        # command를 python 스크립트 실행으로 변경
        imagePullPolicy: Never
        command: ["python", "-m", "scripts.init_db"]
        envFrom:
          - secretRef:
              name: all-in-one-secrets
      restartPolicy: OnFailure
  backoffLimit: 3
  ttlSecondsAfterFinished: 300  # Job 완료 후 5분간 유지
