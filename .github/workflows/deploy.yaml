name: Deploy Chatzzk web

on:
  push:
    branches:
      # - main       # main에 푸시하면 Production 배포
      # - develop    # develop에 푸시하면 Development 배포
      - 'feat/services/devide_collector_web'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🔥 여기가 핵심: 브랜치 이름에 따라 환경(Environment)을 자동으로 선택합니다.
    # main이면 'Production', 아니면 'Development' 환경의 변수를 가져옵니다.
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}

    defaults:
      run:
        working-directory: ./chatzzk-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # 🏗️ 프론트엔드 빌드 (Sentry 업로드 포함)
      - name: Build Frontend
        env:
          # Repository Secret에서 가져옴 (공통)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Environment Variable에서 가져옴 (환경별로 다름!)
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: npm run build

      # 🚀 Cloudflare 배포
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main 브랜치면 프로덕션 배포, 아니면 개발용 배포
          # wrangler.json에 [env.dev] 설정이 있다고 가정
          command: deploy --env ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
          workingDirectory: 'chatzzk-web'
