name: Database Migration

on:
  push:
    branches:
      - main
      - develop  # 개발 브랜치 추가
    paths:
      - 'chatzzk-collector/alembic/**'
      - 'chatzzk-collector/alembic.ini'
      - 'chatzzk-collector/packages/data_access/src/chatzzk_data_access/orm/**'
      - 'chatzzk-collector/scripts/**'
      - 'chatzzk-collector/uv.lock'

  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    # 브랜치에 따라 사용할 DB 시크릿을 결정합니다.
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}

    defaults:
      run:
        working-directory: ./chatzzk-collector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --extra db-migration

      # 1. 공통 Alembic 마이그레이션 실행
      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run alembic upgrade head
