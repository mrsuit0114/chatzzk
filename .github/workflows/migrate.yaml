name: Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'chatzzk-collector/alembic/**'
      - 'chatzzk-collector/alembic.ini'
      - 'chatzzk-collector/packages/data_access/src/chatzzk_data_access/orm/**'
      - 'chatzzk-collector/scripts/**'
      - 'chatzzk-collector/uv.lock'

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./chatzzk-collector

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. uv 설치 (공식 액션 사용)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true # 캐싱 자동 적용 (속도 향상)

      # 2. 파이썬 설정 및 의존성 설치
      # uv sync를 하면 pyproject.toml에 정의된 로컬 패키지도 자동으로 설치(연결)됩니다.
      - name: Install dependencies
        run: |
          uv sync --frozen --package db-migration

      - name: Run Alembic Upgrade
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          uv run alembic upgrade head

      - name: Run Seed Script
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}/chatzzk-collector
        run: |
          uv run python scripts/seed_data.py
